# Task runner for the elements SDK (replaces the Makefile).
# Run tasks with `mise run <task>`, e.g. `mise run build`.
[tools]
node = "26"
# Pinned to the version the monorepo build/tests were validated against. Bump
# deliberately rather than tracking "latest" so CI is reproducible.
bun = "1.4.4"
hk = "2.7.1"
pkl = "0.32.2"
jactionlint = "2.3.0"
shellcheck = "0.11.0"

[env]
_.path = ["node_modules/.bin"]

[tasks.install]
description = "Install workspace dependencies"
run = "bun install"

[tasks.format]
description = "Run hk fixes"
depends = ["install"]
run = "hk fix --all"

[tasks.verify]
run = "./scripts/verify.sh"

[tasks.build]
depends = ["install"]
run = "turbo run build"

[tasks.dev]
depends = ["install"]
run = "turbo run dev"

[tasks.typecheck]
description = "Typecheck TS code with Bun"
depends = ["install"]
run = "turbo run typecheck"

[tasks.lint]
description = "Run hk checks"
depends = ["install"]
run = "hk check --all"

[tasks.test]
description = "Unit tests. Pure and mocked, no live env."
depends = ["install"]
run = "turbo run test"

[tasks.acceptance]
description = "Playwright acceptance tests. Needs a live env and the SDK key."
run = "./scripts/acceptance-test.sh"

[tasks.release]
run = "./scripts/release.sh"

[tasks.release-cdn]
run = "./scripts/release-cdn.sh"
