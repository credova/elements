name: Release

concurrency: deploy

on:
  push:
    branches: [master]

jobs:
  release-sdk:
    runs-on: "ubuntu-latest"

    permissions:
      contents: "write"
      id-token: "write"

    env:
      HUSKY: 0 # disables husky hooks

    steps:
      - name: Generate token
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          token: ${{ steps.generate-token.outputs.token }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.*

      - name: Upgrade npm to 11.5.1+ for OIDC
        run: npm install -g npm@latest

      - name: Build
        run: make build

      - name: Release
        run: make release
        env:
          ENVIRONMENT: prod
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}

      - id: login-to-gcp
        name: Authenticate to GCP
        uses: "google-github-actions/auth@v3"
        with:
          project_id: psqpayments-shd-operations
          workload_identity_provider: projects/6883124133/locations/global/workloadIdentityPools/psqfinancial/providers/psqfinancial-github

      - name: "Set up Cloud SDK"
        uses: "google-github-actions/setup-gcloud@v3"

      - name: Release CDN
        run: make release-cdn
