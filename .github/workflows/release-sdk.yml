---
name: Release

concurrency: deploy

on:
  push:
    branches: [master]

permissions:
  contents: write
  id-token: write

env:
  HUSKY: 0 # disables husky hooks

jobs:
  release-sdk:
    runs-on: ubuntu-latest
    steps:
      # credova-standard release token (RELEASE_DOWNLOADER GitHub App), replacing
      # the bespoke create-github-app-token + RELEASE_APP_* flow.
      - id: release-token
        name: Generate release token
        uses: credova/platform-workflows/actions/auth-release-token@master
        with:
          client-id: ${{ secrets.RELEASE_DOWNLOADER_APP_ID }}
          private-key: ${{ secrets.RELEASE_DOWNLOADER_APP_PRIVATE_KEY }}

      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          token: ${{ steps.release-token.outputs.token }}
          fetch-depth: 0

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          install: true

      - name: Build
        run: mise run build

      # TODO(npm publishing): semantic-release publishes the packages to npm. npm
      # trusted publishing / token for the credova org is being set up separately
      # (with Levi); this step will succeed once that is in place.
      - name: Release (npm)
        run: mise run release
        env:
          ENVIRONMENT: prod
          GITHUB_TOKEN: ${{ steps.release-token.outputs.token }}

      # CDN publish (GCS) — authenticate via the credova psq-github WIF pool
      # (matching the payments-plugin migrations), replacing the old psqfinancial pool.
      - id: auth-gcp
        name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          project_id: psqpayments-shd-operations
          workload_identity_provider: projects/50446899764/locations/global/workloadIdentityPools/psq-github/providers/psq-github

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Release CDN
        run: mise run release-cdn
