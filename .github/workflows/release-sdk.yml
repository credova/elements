---
name: Release

concurrency: deploy

on:
  push:
    branches: [master]

permissions:
  contents: write
  id-token: write

env:
  HUSKY: 0 # disables husky hooks

jobs:
  release-sdk:
    runs-on: ubuntu-latest
    steps:
      # Token for semantic-release, which pushes the version + CHANGELOG commit back to
      # master (@semantic-release/git) and creates the GitHub release. Uses the
      # fxt-semantic-release GitHub App, whose installation includes public repos —
      # unlike the RELEASE_DOWNLOADER org secrets, which are private-visibility and
      # resolve empty in this public repo (that mismatch is what broke the release).
      # RELEASE_DOWNLOADER is for downloading releases from private repos; this repo
      # only needs write access to itself.
      - id: release-token
        name: Generate release token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.SEMANTIC_RELEASE_APP_ID }}
          private-key: ${{ secrets.SEMANTIC_RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          token: ${{ steps.release-token.outputs.token }}
          fetch-depth: 0

      - name: Setup mise
        uses: jdx/mise-action@v4
        with:
          install: true

      # cards.updateCvc() needs the BT CVC-update app keys inlined into the bundle at build
      # time (dotenv-webpack + babel-plugin-inline-dotenv read js-sdk/.env). Without this
      # file the published SDK ships with undefined keys, so fail the release instead.
      # Use repo-level secrets: private-visibility org secrets resolve empty in this public repo.
      - name: Write js-sdk .env
        env:
          PUBLICSQUARE_CVC_UPDATE_APP_KEY: ${{ secrets.PUBLICSQUARE_CVC_UPDATE_APP_KEY }}
          PUBLICSQUARE_CVC_UPDATE_TEST_APP_KEY: ${{ secrets.PUBLICSQUARE_CVC_UPDATE_TEST_APP_KEY }}
        run: |
          for name in PUBLICSQUARE_CVC_UPDATE_APP_KEY PUBLICSQUARE_CVC_UPDATE_TEST_APP_KEY; do
            if [ -z "${!name}" ] || [[ "${!name}" == *your_key* ]]; then
              echo "::error::Secret $name is not set (or is the .env.example placeholder); refusing to publish an SDK without it"
              exit 1
            fi
          done
          {
            echo "PUBLICSQUARE_CVC_UPDATE_APP_KEY=$PUBLICSQUARE_CVC_UPDATE_APP_KEY"
            echo "PUBLICSQUARE_CVC_UPDATE_TEST_APP_KEY=$PUBLICSQUARE_CVC_UPDATE_TEST_APP_KEY"
          } > js-sdk/.env

      - name: Build
        run: mise run build

      # semantic-release publishes both SDK packages to npm via OIDC trusted
      # publishing — no NPM_TOKEN. The id-token:write permission above lets
      # @semantic-release/npm (>=13.1, bundling npm >=11.5.1) mint short-lived
      # credentials at publish time. Each package's trusted publisher must be
      # registered on npmjs.com pinned to this repo + workflow file:
      #   @publicsquare/elements-js, @publicsquare/elements-react
      #   -> credova/elements, workflow: release-sdk.yml (no environment)
      - name: Release (npm)
        run: mise run release
        env:
          ENVIRONMENT: prod
          GITHUB_TOKEN: ${{ steps.release-token.outputs.token }}

      # CDN publish (GCS) — authenticate via the credova psq-github WIF pool
      # (matching the payments-plugin migrations), replacing the old psqfinancial pool.
      - id: auth-gcp
        name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          project_id: psqpayments-shd-operations
          workload_identity_provider: projects/50446899764/locations/global/workloadIdentityPools/psq-github/providers/psq-github

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Release CDN
        run: mise run release-cdn
