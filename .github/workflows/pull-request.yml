---
name: Pull Request

on:
  pull_request:
    branches: [master]

concurrency:
  group: '${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}'
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  ci:
    uses: credova/platform-workflows/.github/workflows/node-pull-request.yaml@master
    secrets: inherit
    with:
      container: false
      test-command: mise run test && mise run build && mise run typecheck

  gate:
    name: Gate
    needs:
      - ci
    if: always()
    runs-on: warp-ubuntu-2404-x64-2x
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *)
                echo "::error::a required job concluded '$result'"
                exit 1
                ;;
            esac
          done
