---
name: Pull Request

on:
  pull_request:
    branches: [master]

concurrency:
  group: '${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}'
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  ci:
    uses: credova/platform-workflows/.github/workflows/node-pull-request.yaml@master
    secrets: inherit
    with:
      container: false
      # compliance + security (grype/grant/opengrep, replacing the old local
      # ./.github/actions/security) + `mise run lint` run built-in.
      # The Playwright acceptance suite (`mise run test`) needs a live environment
      # and the SDK key, so it is excluded from PR CI (run out-of-band); the build
      # is validated here instead.
      test-command: mise run build
