---
name: Pull Request

on:
  pull_request:
    branches: [master]

concurrency:
  group: '${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}'
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  ci:
    uses: credova/platform-workflows/.github/workflows/node-pull-request.yaml@master
    secrets: inherit
    with:
      container: false
      # compliance + security (grype/grant/opengrep, replacing the old local
      # ./.github/actions/security) + `mise run lint` run built-in.
      # Run the jest unit tests (`mise run test`) and validate the build in the
      # shared workflow's test step. The Playwright acceptance suite
      # (`mise run acceptance`) needs a live environment and the SDK key, so it
      # stays out of PR CI and is run out-of-band.
      test-command: mise run test && mise run build

  gate:
    name: Gate
    needs:
      - ci
    if: always()
    runs-on: warp-ubuntu-2404-x64-2x
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *)
                echo "::error::a required job concluded '$result'"
                exit 1
                ;;
            esac
          done
