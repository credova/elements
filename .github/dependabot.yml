version: 2
updates:
  # Tier 2: 14th of month, 4 AM LA. No Dependabot security updates for bun.
  - package-ecosystem: "bun"
    directories: ["/", "/js-sdk", "/react-sdk", "/example-app"]
    schedule:
      interval: cron
      cronjob: "0 4 14 * *" # 14th, 4am LA
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    rebase-strategy: disabled
    groups:
      bun-version:
        applies-to: version-updates
        patterns: ["*"]

  # Tier 4: 28th of month, 4 AM LA
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: cron
      cronjob: "0 4 28 * *" # 28th, 4am LA
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    rebase-strategy: disabled
    groups:
      gha-version:
        applies-to: version-updates
        patterns: ["*"]
      gha-security:
        applies-to: security-updates
        patterns: ["*"]
